<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SM Systems measurement QA fixture</title>
  </head>
  <body>
    <button id="run">Run valid conversion path</button>
    <script>
      window.dataLayer = [];
      document.querySelector('#run').addEventListener('click', () => {
        const shared = {
          event_version: 'sm-measurement-v1',
          page_path: '/qa/fixture/',
        };
        window.dataLayer.push({ event: 'page_view', ...shared, page_title: document.title });
        window.dataLayer.push({ event: 'view_case_study', ...shared, case_study_path: '/work/example/' });
        window.dataLayer.push({ event: 'click_email', ...shared, link_location: 'site' });
        window.dataLayer.push({ event: 'click_upwork_profile', ...shared, link_location: 'site' });
        window.dataLayer.push({
          event: 'click_external_portfolio',
          ...shared,
          link_domain: 'example.com',
        });
        window.dataLayer.push({
          event: 'form_start',
          ...shared,
          form_name: 'sm_project_enquiry_v1',
          submission_id: 'sm-inbound-qa-success-001',
        });
        window.dataLayer.push({
          event: 'generate_lead',
          ...shared,
          form_name: 'sm_project_enquiry_v1',
          submission_id: 'sm-inbound-qa-success-001',
        });
      });
    </script>
  </body>
</html>
